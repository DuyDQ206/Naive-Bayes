[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "naive-bayes-text"
version = "1.0.0"
description = "Naive Bayes text classification for CS313: spam filtering and sentiment analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CS313 Group Project" }]
keywords = ["naive-bayes", "text-classification", "spam-detection",
            "sentiment-analysis", "scikit-learn", "education"]
classifiers = [
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "scikit-learn>=1.5,<2",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "joblib>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "nbformat>=5.9"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
nb-text = "naive_bayes_text.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
